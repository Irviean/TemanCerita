<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TemanCerita</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-teal: #3d6b67;
            --bg-page: #f4f5f0;
            --input-bg: #f3f3f0;
            --text-dark: #1a1a1a;
            --text-gray: #666;
            --white: #ffffff;
            --error-red: #d93025;
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: var(--bg-page);
            align-items: center;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            width: 100%;
        }

        .logo {
            margin-bottom: 30px;
            text-align: center;
        }

        .logo h2 {
            color: var(--primary-teal);
            font-weight: 700;
            letter-spacing: -1px;
            margin: 0;
            font-size: 24px;
        }

        .logo-line {
            width: 30px;
            height: 3px;
            background: var(--primary-teal);
            margin: 5px auto 0;
        }

        .card {
            background: var(--white);
            width: 100%;
            max-width: 480px;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
            text-align: center;
        }

        .role-selector {
            display: flex;
            background: #e9e9e2;
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 35px;
            position: relative;
        }

        .role-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            color: var(--text-gray);
            transition: color 0.4s ease;
            position: relative;
            z-index: 2;
        }

        .role-btn.active {
            color: white;
        }

        .selector-bg {
            position: absolute;
            top: 5px;
            left: 5px;
            width: calc(50% - 5px);
            height: calc(100% - 10px);
            background: var(--primary-teal);
            border-radius: 10px;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }

        .role-selector.is-konselor .selector-bg {
            transform: translateX(100%);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 10px;
            color: var(--text-dark);
        }

        #subtitle {
            font-size: 13px;
            color: var(--text-gray);
            margin-bottom: 20px;
            transition: opacity 0.3s;
        }

        /* Message Box untuk Backend */
        #messageBox {
            font-size: 12px;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none; /* Sembunyi jika tidak ada pesan */
        }
        .error-msg { background: #fce8e6; color: var(--error-red); display: block !important; }
        .success-msg { background: #e6f4ea; color: #1e8e3e; display: block !important; }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .form-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-dark);
            text-transform: uppercase;
        }

        .forgot-link {
            font-size: 10px;
            font-weight: 700;
            color: var(--primary-teal);
            text-decoration: none;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            color: #b0b0b0;
        }

        .input-field {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: var(--input-bg);
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 13px;
            outline: none;
            transition: border 0.3s;
        }

        .input-field:focus {
            border-color: #bce3df;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .checkbox-container input {
            width: 16px;
            height: 16px;
            accent-color: var(--primary-teal);
        }

        .checkbox-container label {
            font-size: 11px;
            color: var(--text-gray);
        }

        .btn-main {
            width: 100%;
            background: var(--primary-teal);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .divider {
            font-size: 10px;
            font-weight: 700;
            color: #b0b0b0;
            margin: 25px 0;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .divider::before, .divider::after {
            content: "";
            height: 1px;
            background: #e0e0e0;
            flex: 1;
        }

        .btn-google {
            width: 100%;
            background: white;
            border: 1px solid #e0e0e0;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            margin-bottom: 35px;
        }

        .footer-card {
            font-size: 12px;
            color: var(--text-gray);
        }

        .footer-card a {
            color: var(--primary-teal);
            font-weight: 700;
            text-decoration: none;
        }

        .page-footer {
            width: 100%;
            background-color: var(--white);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 60px;
            box-sizing: border-box;
            border-top: 1px solid #eeeeee;
        }

        .footer-left {
            font-size: 10px;
            font-weight: 600;
            color: #9ca3af;
            text-transform: uppercase;
        }

        .footer-right {
            display: flex;
            gap: 20px;
        }

        .footer-right span {
            font-size: 10px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            cursor: pointer;
        }

        #loginForm { transition: opacity 0.3s ease; }
        .fade-out { opacity: 0; }
    </style>
</head>
<body>

    <div class="main-content">
        <div class="logo">
            <h2>TemanCerita</h2>
            <div class="logo-line"></div>
        </div>

        <div class="card">
            <div class="role-selector" id="roleSelector">
                <div class="selector-bg"></div>
                <button type="button" class="role-btn active" onclick="switchRole('mahasiswa')">Mahasiswa</button>
                <button type="button" class="role-btn" onclick="switchRole('konselor')">Konselor</button>
            </div>

            <h1>Selamat Datang</h1>
            <p id="subtitle">Silakan masuk menggunakan akun mahasiswa Anda.</p>

            <div id="messageBox">Pesan error di sini</div>

            <form id="loginForm">
                <input type="hidden" name="user_role" id="roleInput" value="mahasiswa">

                <div class="form-group">
                    <label class="form-label" id="emailLabel">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        EMAIL MAHASISWA 
                    </label>
                    <div class="input-container">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        </span>
                        <input type="email" name="email" id="emailInput" class="input-field" placeholder="nama@student.polimedia.ac.id" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label class="form-label">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            KATA SANDI 
                        </label>
                        <a href="#" class="forgot-link">Lupa Kata Sandi?</a>
                    </div>
                    <div class="input-container">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        </span>
                        <input type="password" name="password" id="passwordInput" class="input-field" placeholder="........." required>
                    </div>
                </div>

                <div class="checkbox-container">
                    <input type="checkbox" name="remember_me" id="remember">
                    <label for="remember">Ingat saya di perangkat ini</label>
                </div>

                <button type="submit" class="btn-main" id="submitBtn">
                    Masuk ke Akun &rarr;
                </button>
            </form>

            <div class="divider">ATAU</div>
            <button type="button" class="btn-google">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="16" alt="Google">
                Lanjutkan dengan Google
            </button>

            <div class="footer-card">
                Belum memiliki akun? <a href="Register.html">Daftar Baru</a>
            </div>
        </div>
    </div>

    <footer class="page-footer">
        <div class="footer-left">© 2026 POLIMEDIA KREATIF • ACADEMIC SANCTUARY</div>
        <div class="footer-right">
            <span>BANTUAN</span> <span>KEBIJAKAN LAYANAN</span> <span>PRIVASI</span>
        </div>
    </footer>

    <script>
        function switchRole(role) {
            const selector = document.getElementById('roleSelector');
            const subtitle = document.getElementById('subtitle');
            const emailLabel = document.getElementById('emailLabel');
            const emailInput = document.getElementById('emailInput');
            const roleInput = document.getElementById('roleInput');
            const form = document.getElementById('loginForm');
            const buttons = document.querySelectorAll('.role-btn');

            // Update Hidden Input Value
            roleInput.value = role;

            if (role === 'konselor') {
                selector.classList.add('is-konselor');
                buttons[1].classList.add('active');
                buttons[0].classList.remove('active');
            } else {
                selector.classList.remove('is-konselor');
                buttons[0].classList.add('active');
                buttons[1].classList.remove('active');
            }

            form.classList.add('fade-out');
            subtitle.classList.add('fade-out');

            setTimeout(() => {
                if (role === 'konselor') {
                    subtitle.innerText = "Silakan masuk menggunakan akun konselor Anda.";
                    emailLabel.innerHTML = `
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        EMAIL KONSELOR
                    `;
                    emailInput.placeholder = "nama@polimedia.ac.id";
                } else {
                    subtitle.innerText = "Silakan masuk menggunakan akun mahasiswa Anda.";
                    emailLabel.innerHTML = `
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        EMAIL MAHASISWA
                    `;
                    emailInput.placeholder = "nama@student.polimedia.ac.id";
                }
                form.classList.remove('fade-out');
                subtitle.classList.remove('fade-out');
            }, 300);
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgBox = document.getElementById('messageBox');
            const formData = {
                email: document.getElementById('emailInput').value,
                password: document.getElementById('passwordInput').value,
                role: document.getElementById('roleInput').value
            };

            try {
                const res = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = data.user.role === 'konselor' ? 'dashboard-konselor.html' : 'index.html';
                } else {
                    msgBox.textContent = data.error;
                    msgBox.className = 'error-msg';
                }
            } catch (err) {
                msgBox.textContent = "Koneksi ke server gagal.";
                msgBox.className = 'error-msg';
            }
        });
    </script>
</body>
</html>
